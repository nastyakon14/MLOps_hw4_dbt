name: transactions_analytics
version: "1.0.0"
config-version: 2
profile: transactions_analytics
require-dbt-version: [">=1.10.0", "<1.11.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - target
  - dbt_packages
  - logs

dispatch:
  - macro_namespace: dbt_expectations
    search_order: ["transactions_analytics", "dbt_expectations"]

vars:
  "dbt_date:time_zone": "UTC"
  large_amount_threshold: 100
  risk_high_rate: 20
  hourly_min_transactions: 100
  hourly_risk_multiplier: 1.5
  merchant_min_frauds: 3
  merchant_suspicious_rate: 2

models:
  transactions_analytics:
    staging:
      +materialized: table
      +tags: ["staging"]
    marts:
      +materialized: table
      +tags: ["mart"]

seeds:
  transactions_analytics:
    states:
      +engine: MergeTree()
      +order_by: "(state_code)"
      +column_types:
        state_code: String
        state_name: String
        census_region: String
