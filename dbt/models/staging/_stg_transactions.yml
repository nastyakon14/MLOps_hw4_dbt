version: 2

models:
  - name: stg_transactions
    description: >
      Очищенный журнал транзакций. Типы приведены к схеме источника,
      сумма разложена по корзинам, клиент собран в стабильный ключ.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "amount >= 0"
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
            max_value: 2000000
    columns:
      - name: transaction_sk
        description: Суррогатный ключ строки. В этом датасете строки не повторяются.
        tests:
          - not_null
          - unique
      - name: transaction_time
        description: Время операции.
        tests:
          - not_null
      - name: transaction_date
        description: Календарный день операции.
        tests:
          - not_null
      - name: transaction_hour
        description: Час операции, от 0 до 23.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 23
      - name: day_of_week
        description: День недели по ISO, понедельник = 1, воскресенье = 7. Считает dbt_date.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 7
      - name: day_name
        description: Название дня недели.
        tests:
          - not_null
      - name: week_start_date
        description: Начало недели операции. Считает dbt_date.week_start.
        tests:
          - not_null
      - name: merch
        description: Мерчант.
        tests:
          - not_null
      - name: cat_id
        description: Категория покупки.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - entertainment
                  - food_dining
                  - gas_transport
                  - grocery_net
                  - grocery_pos
                  - health_fitness
                  - home
                  - kids_pets
                  - misc_net
                  - misc_pos
                  - personal_care
                  - shopping_net
                  - shopping_pos
                  - travel
      - name: amount
        description: Сумма операции.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100000
      - name: amount_bucket
        description: >
          Корзина суммы из макроса amount_bucket.
          xs < 10, s < 50, m < 100, l < 500, иначе xl.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["xs", "s", "m", "l", "xl"]
      - name: is_large_transaction
        description: 1, если сумма не ниже large_amount_threshold (100).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: name_1
        description: Имя клиента.
        tests:
          - not_null
      - name: name_2
        description: Фамилия клиента.
        tests:
          - not_null
      - name: gender
        description: Пол клиента.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: us_state
        description: Штат клиента.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('states')
                field: state_code
      - name: lat
        description: Широта клиента.
        tests:
          - not_null
      - name: lon
        description: Долгота клиента.
        tests:
          - not_null
      - name: merchant_lat
        description: Широта мерчанта.
        tests:
          - not_null
      - name: merchant_lon
        description: Долгота мерчанта.
        tests:
          - not_null
      - name: distance_km
        description: Расстояние от клиента до мерчанта в километрах.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: customer_id
        description: Ключ клиента из имени, фамилии, штата и координат.
        tests:
          - not_null
      - name: target
        description: Исходный признак фрода.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_fraud
        description: Тот же признак фрода, явное имя для витрин.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
